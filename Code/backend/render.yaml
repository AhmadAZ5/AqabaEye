services:
  - type: web
    name: aqaba-eye
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CONTACT_EMAIL
        value: Eyeofaqaba@gmail.com
      - key: ENV
        value: production
