<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<script>document.documentElement.classList.add('js')</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_name_ar if lang == 'ar' else site_name_en }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ t('home.hero_subtitle') }}{% endblock %}">
<link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96">
<link rel="shortcut icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/site.webmanifest">
<link rel="alternate" hreflang="ar" href="{{ request.url.path if lang == 'ar' else alt_path }}">
<link rel="alternate" hreflang="en" href="{{ request.url.path if lang == 'en' else alt_path }}">
<link rel="stylesheet" href="/static/css/main.css">
{% block extra_head %}{% endblock %}
</head>
<body>
{% include "partials/header.html" %}
<main class="site-main">
{% block content %}{% endblock %}
</main>
{% include "partials/footer.html" %}
<script src="/static/js/main.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
